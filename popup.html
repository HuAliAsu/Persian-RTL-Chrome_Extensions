<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="control-group site-toggle-group site-toggle-top">
    <div class="site-info">
      <span>فعال برای این سایت:</span>
      <span id="currentHostname" class="hostname" dir="ltr">...</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="siteToggle" aria-label="فعال‌سازی افزونه برای سایت فعلی">
      <span class="slider-thumb" aria-hidden="true"></span>
    </label>
  </div>

  <div class="header">
    <label class="checkbox-label">
      <input type="checkbox" id="globalToggle">
      <span>غیرفعال کردن کل افزونه</span>
    </label>
  </div>

  <fieldset id="settingsContainer">
    <div class="control-group rtl-mode-group">
      <div class="setting-copy">
        <label for="rtlModeToggle">تشخیص فقط بر اساس کلمهٔ اول پاراگراف</label>
        <span id="rtlModeDescription">پیش‌فرض خاموش است: با یک کلمهٔ فارسی در هر جای متن، کل پاراگراف راست‌چین می‌شود</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="rtlModeToggle" aria-describedby="rtlModeDescription">
        <span class="slider-thumb" aria-hidden="true"></span>
      </label>
    </div>

    <div class="control-group">
      <label for="fontSelect">انتخاب فونت:</label>
      <select id="fontSelect">
        <option value="none" class="no-font-option">بدون تغییر فونت</option>
        <option value="Vazirmatn[wght]">وزیرمتن (Vazirmatn)</option>
        <option value="Samim">صمیم (Samim)</option>
        <option value="Sahel-VF">ساحل (Sahel)</option>
        <option value="Gandom">گندم (Gandom)</option>
        <option value="Mikhak[DSTY,KSHD,wght]">میخک (Mikhak)</option>
      </select>
    </div>

    <div class="control-group">
      <div class="slider-header">
        <label for="fontSizeSlider">
          بزرگ‌نمایی
          <span class="site-label" id="siteLabel"></span>
        </label>
        <span id="fontSizeValue" dir="ltr">100%</span>
      </div>
      <input type="range" id="fontSizeSlider" min="80" max="150" value="100" step="5">
    </div>

    <button id="openSitesBtn" class="sites-btn">
      مشاهده سایت‌های فعال‌شده
      <span id="siteCount" class="badge">0</span>
    </button>
  </fieldset>

  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
